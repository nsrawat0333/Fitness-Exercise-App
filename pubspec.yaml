name: fitness_app
description: "FitFi - AI Powered Smart Fitness Coach"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  lottie: ^3.1.2
  video_player: ^2.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/explore/
    - assets/images/gym/
    - assets/images/jsonanimation/
    - assets/images/yogajsonanimation/
    - assets/images/therapy/
    - assets/images/therepy/jsonanimationheadeche/
    - assets/images/therepy/jsonanimationneckpain/
    - assets/images/therepy/jsonanimationbackpain/
    - assets/images/therepy/jsonanimationkneepain/
    - assets/images/therepy/jsonanimationperiodscare/
    - assets/images/therepy/jsonanimationstomackpain/
